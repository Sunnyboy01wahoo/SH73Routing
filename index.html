<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>SH73 Routing</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#e6e6e6;
}

#controls{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:#f5f5f5;
    padding:15px;
    border:1px solid #cfcfcf;
    border-radius:8px;
    box-shadow:
        0 2px 12px
        rgba(0,0,0,0.15);
    width:340px;
    max-height:95vh;
    overflow:auto;
    box-sizing:border-box;
}

#controls h3{
    margin-top:0;
}

label{
    display:block;
    font-weight:500;
}

select{
    width:100%;
    padding:4px;
    box-sizing:border-box;
}

input[type=range]{
    width:100%;
}

canvas{
    display:block;
    background:#e6e6e6;
}

hr{
    border:none;
    border-top:1px solid #d4d4d4;
    margin:14px 0;
}

</style>

</head>

<body>

<div id="controls">

<h3>Route Controls</h3>

<label>Start Node</label>
<select id="startNode"></select>

<br>

<label>End Node</label>
<select id="endNode"></select>

<br>

<label>
    <input
        type="checkbox"
        id="enableRouting">
    Enable Routing
</label>

<hr>

<h3>Constraint Weights</h3>

<div id="weights"></div>

</div>

<canvas id="canvas"></canvas>

<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="app.js"></script>

</body>
</html>
